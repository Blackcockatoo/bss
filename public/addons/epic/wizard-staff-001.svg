<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Staff of Eternal Wisdom">
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#11203A"/>
      <stop offset="50%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#03060e"/>
    </radialGradient>
    <linearGradient id="wood" x1="512" y1="400" x2="512" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8A5728"/>
      <stop offset="52%" stop-color="#4A2F1A"/>
      <stop offset="100%" stop-color="#25140C"/>
    </linearGradient>
    <linearGradient id="crystal" x1="430" y1="200" x2="600" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0FDFF"/>
      <stop offset="40%" stop-color="#7DD3FC"/>
      <stop offset="76%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9BE7FF" stop-opacity="0.4"/>
      <stop offset="48%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0b2"/>
      <stop offset="45%" stop-color="#f4c451"/>
      <stop offset="100%" stop-color="#8a5b14"/>
    </linearGradient>
    <filter id="staffGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="staffStrong" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="18" result="b1"/>
      <feGaussianBlur stdDeviation="5" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cardClipStaff"><rect x="36" y="36" width="952" height="952" rx="48"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bgGradient)"/>
  <g clip-path="url(#cardClipStaff)">
    <rect x="36" y="36" width="952" height="952" rx="48" fill="url(#bgGradient)"/>

    <!-- arcane rings around the crystal -->
    <g opacity="0.5" fill="none">
      <circle cx="512" cy="330" r="200" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="3"/>
      <circle cx="512" cy="330" r="150" stroke="#A78BFA" stroke-opacity="0.18" stroke-width="2.5"/>
      <path d="M512 150 L654 210 L714 352 L654 494 L370 494 L310 352 L370 210 Z" stroke="#93C5FD" stroke-opacity="0.16" stroke-width="2.5"/>
    </g>

    <g opacity="0.5">
      <circle cx="220" cy="220" r="2.2" fill="#cde9ff"/>
      <circle cx="820" cy="260" r="2.6" fill="#fff"/>
      <circle cx="770" cy="150" r="1.6" fill="#bcd9ff"/>
      <circle cx="250" cy="470" r="2" fill="#fff"/>
      <circle cx="840" cy="470" r="1.8" fill="#cde9ff"/>
    </g>

    <!-- halo behind crystal -->
    <circle cx="512" cy="330" r="180" fill="url(#halo)"/>

    <!-- runic spokes -->
    <g stroke="#DFF8FF" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
      <path d="M512 214 V446"/>
      <path d="M404 330 H620"/>
      <path d="M446 264 L578 396"/>
      <path d="M578 264 L446 396"/>
    </g>

    <!-- staff shaft -->
    <g>
      <path d="M492 430 L484 936" stroke="url(#wood)" stroke-width="20" stroke-linecap="round"/>
      <path d="M512 420 L512 952" stroke="url(#wood)" stroke-width="30" stroke-linecap="round"/>
      <path d="M532 430 L540 936" stroke="url(#wood)" stroke-width="20" stroke-linecap="round"/>
      <path d="M506 470 C522 606 526 772 520 928" stroke="#D6A56B" stroke-opacity="0.34" stroke-width="5" stroke-linecap="round"/>
      <!-- gold binding where crystal meets shaft -->
      <path d="M470 452 C500 470 524 470 554 452" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
      <path d="M478 486 C502 500 522 500 546 486" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- crystal -->
    <g filter="url(#staffStrong)">
      <path d="M462 270 L420 428 L512 512 L604 428 L562 270 L512 190 Z"
            fill="url(#crystal)" stroke="#E0F2FE" stroke-width="9" stroke-linejoin="round"/>
    </g>
    <!-- crystal inner facets -->
    <g stroke="#E0F2FE" stroke-opacity="0.6" stroke-width="3" fill="none">
      <path d="M512 190 L512 512"/>
      <path d="M462 270 L562 270"/>
      <path d="M420 428 L604 428"/>
      <path d="M462 270 L420 428 M562 270 L604 428"/>
    </g>

    <!-- singularity core -->
    <g filter="url(#staffGlow)">
      <circle cx="512" cy="356" r="42" fill="#DFF8FF" fill-opacity="0.9"/>
      <circle cx="512" cy="356" r="18" fill="#04101f"/>
    </g>

    <!-- orbiting nodes -->
    <g filter="url(#staffGlow)">
      <circle cx="404" cy="238" r="12" fill="#7DD3FC"/>
      <circle cx="512" cy="180" r="13" fill="#F0FDFF"/>
      <circle cx="620" cy="238" r="12" fill="#A78BFA"/>
      <circle cx="676" cy="356" r="10" fill="#38BDF8"/>
      <circle cx="348" cy="356" r="10" fill="#38BDF8"/>
    </g>
  </g>
</svg>
