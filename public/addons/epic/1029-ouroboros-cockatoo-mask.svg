<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900"
              viewBox="0 0 900 900"
              role="img"
              aria-label="Ouroboros Cockatoo Mask"
            >
              <defs>
<style>
.spin36{transform-box:fill-box;transform-origin:center;animation:spin36 36s linear infinite}.pulse6{animation:pulse 6s ease-in-out infinite}.pulse7{animation:pulse 7s ease-in-out infinite}.pulse8{animation:pulse 8s ease-in-out infinite}@keyframes spin36{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
</style>
                <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#0b1e30"/>
                  <stop offset="40%" stop-color="#10263d"/>
                  <stop offset="100%" stop-color="#050b13"/>
                </linearGradient>
                <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#7c5b16"/>
                  <stop offset="30%" stop-color="#f1cc6b"/>
                  <stop offset="60%" stop-color="#a77d24"/>
                  <stop offset="100%" stop-color="#5c4312"/>
                </linearGradient>
                <linearGradient id="obsidian" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#10151d"/>
                  <stop offset="100%" stop-color="#020409"/>
                </linearGradient>
                <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#8ff8ff" stop-opacity="0.95"/>
                  <stop offset="35%" stop-color="#46d9e8" stop-opacity="0.65"/>
                  <stop offset="100%" stop-color="#46d9e8" stop-opacity="0"/>
                </radialGradient>
                <radialGradient id="violetGlow" cx="50%" cy="50%" r="60%">
                  <stop offset="0%" stop-color="#9e6bff" stop-opacity="0.5"/>
                  <stop offset="100%" stop-color="#9e6bff" stop-opacity="0"/>
                </radialGradient>
                <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
                  <feGaussianBlur stdDeviation="7" result="blur"/>
                  <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                  </feMerge>
                </filter>
                <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
                  <feGaussianBlur stdDeviation="3.5" result="blur"/>
                  <feColorMatrix
                    in="blur"
                    type="matrix"
                    values="1 0 0 0 0
                            0 0.9 0 0 0
                            0 0 0.5 0 0
                            0 0 0 0.8 0"
                 />
                  <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                  </feMerge>
                </filter>
              </defs>

