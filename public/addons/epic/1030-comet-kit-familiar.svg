<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Comet Kit Familiar">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0a1a"/>
      <stop offset="50%" stop-color="#160f2b"/>
      <stop offset="100%" stop-color="#1c1030"/>
    </linearGradient>
    <radialGradient id="nebula" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4a2f8a" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#231548" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="kitGlow" cx="50%" cy="50%" r="50%">
