name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Geometry sprite lock
        run: npm run check:geometry-sprite-lock

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert child-safe deployment config
        env:
          STUDENT_DEPLOYMENT: ${{ vars.STUDENT_DEPLOYMENT }}
          NEXT_PUBLIC_CHILD_SAFE_BASELINE: ${{ vars.NEXT_PUBLIC_CHILD_SAFE_BASELINE }}
          NEXT_PUBLIC_APP_PROFILE: ${{ vars.NEXT_PUBLIC_APP_PROFILE }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: npm run check:child-safe-deployment

      - name: Build
        run: npm run build

      - name: Install Chromium for Forge browser verification
        run: npx playwright install --with-deps chromium

      - name: Verify Forge in the production browser runtime
        run: |
          npm run start -- -H 127.0.0.1 -p 3001 > /tmp/forge-server.log 2>&1 &
          FORGE_SERVER_PID=$!
          trap 'kill "$FORGE_SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3001/project-forge > /dev/null; then break; fi
            sleep 1
          done
          node scripts/project-forge/browser-smoke.cjs

      - name: Preserve Forge browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-browser-evidence
          path: |
            /tmp/forge-mobile.png
            /tmp/forge-server.log
          if-no-files-found: ignore
